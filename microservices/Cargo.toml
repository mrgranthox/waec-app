[workspace]
resolver = "2"
members = [
    "common",
    "auth",
    "payment",
    "distributor",
    "handler",
    "admin",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "Proprietary"
authors = ["WAEC Platform Team"]

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
# gRPC
tonic = { version = "0.12", features = ["tls", "transport"] }
prost = "0.13"
tonic-build = "0.12"
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Errors & logging
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
# Web/HTTP
axum = { version = "0.7", features = ["http2", "macros"] }
tower = "0.5"
hyper = { version = "1", features = ["full"] }
# Crypto
aes-gcm = "0.10"
argon2 = "0.5"
jsonwebtoken = "9"
rand = "0.8"
zeroize = { version = "1", features = ["zeroize_derive"] }
hex = "0.4"
# Database
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid", "rust_decimal", "migrate"] }
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
# Config
config = { version = "0.14", features = ["yaml"] }
# Testing
mockito = "1"
temp-env = "0.3"
