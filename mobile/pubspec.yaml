name: waec_direct
description: "WAEC Direct — enterprise official result verification & on-demand retrieval client (Ghana)"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
#
# Version 3.1.4 / build 20260901 — aligned with the published WAEC Direct
# brand (see docs/WAEC Result Verification App + assets/brand_kit.json).
version: 3.1.4+20260901

environment:
  sdk: ^3.13.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  # State management — in-memory only (plan §3.8)
  flutter_riverpod: ^2.6.1

  # Networking: TLS 1.3, REST, SSE transport
  dio: ^5.7.0
  crypto: ^3.0.3

  # Idempotency keys (plan §3.9)
  uuid: ^4.5.1

  # Local encrypted storage (plan §3.7)
  sqflite: ^2.3.3
  sqflite_common_ffi: ^2.3.3
  encrypt: ^5.0.3
  path_provider: ^2.1.4

  # Biometric login (plan §3.2)
  local_auth: ^2.3.0

  # Keystore/Keychain-backed storage for the biometric-unlockable session
  # (refresh token + identity). Never holds the password. The R8 keep-rules
  # for this plugin already exist in android/app/proguard-rules.pro.
  flutter_secure_storage: ^9.2.2

  # Export (plan §3.10)
  pdf: ^3.11.1

  # Runtime app metadata (version / build / bundle id) — About screen (§UX)
  package_info_plus: ^8.1.0

  # Branded splash hand-off (FlutterNativeSplash.preserve/remove) so the
  # native splash continues seamlessly into the in-app branded splash.
  flutter_native_splash: ^2.4.0

  # External support links (email / maps) from the About screen
  url_launcher: ^6.3.0

  # Typography — DM Sans (UI) + JetBrains Mono (index/ref numbers), per the
  # WAEC Direct design system (docs/WAEC Result Verification App/src/index.css).
  google_fonts: ^6.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  test: ^1.31.1

  # Brand asset pipeline (see plan plans/brand-icon-splash-fix.md).
  # Regenerate the launcher icon + splash screen from the clean masters in
  # assets/brand/ (produced by scripts/gen_brand_assets.sh).
  flutter_launcher_icons: ^0.14.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # WAEC Direct brand assets (logo + splash, see assets/brand_kit.json).
  assets:
    - assets/logo.png
    - assets/splash.png
    - assets/brand_kit.json
    # Clean brand masters consumed by flutter_launcher_icons / flutter_native_splash
    # and by the Flutter UI (splash + About). Produced by scripts/gen_brand_assets.sh
    # from assets/brand_kit.json (the single source of truth).
    - assets/brand/icon_master.png
    - assets/brand/adaptive_foreground.png
    - assets/brand/splash_logo.png
    - assets/brand/logo_mark.png
    - assets/brand/android12_icon.png

  # Typography — DM Sans (UI) + JetBrains Mono (index / reference numbers) are
  # loaded at runtime via the google_fonts package (see core/design_tokens.dart),
  # mirroring the Figma design's Google Fonts import. No bundled .ttf assets.

# ─────────────────────────────────────────────────────────────────────────────
# Launcher icon (flutter_launcher_icons)
# White icon_master on a white adaptive background, with the navy/mint glyph
# as the adaptive foreground. remove_alpha_ios avoids a transparent ring on iOS.
# ─────────────────────────────────────────────────────────────────────────────
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/brand/icon_master.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/brand/adaptive_foreground.png"
  remove_alpha_ios: true
  min_sdk_android: 21
  web:
    generate: false
  windows:
    generate: false
    image_path: "assets/brand/icon_master.png"
  macos:
    generate: false

# ─────────────────────────────────────────────────────────────────────────────
# Splash screen (flutter_native_splash)
# White splash with the brand glyph + name + description + progress bar, plus
# an Android 12+ (SplashScreen API) branded icon. NOTE: on Android 12+ the OS
# scales and masks the icon into a CIRCLE, so `android_12.image` must be the
# glyph-only master (no wordmark) or it gets cut off.
# ─────────────────────────────────────────────────────────────────────────────
flutter_native_splash:
  color: "#0A2540"
  color_dark: "#0A2540"
  image: "assets/brand/splash_logo.png"
  android_12:
    image: "assets/brand/android12_icon.png"
    icon_background_color: "#0A2540"
  android: true
  ios: true
  web: false
  # Two-phase splash: native (this) holds the screen until Flutter paints,
  # then BrandedSplash (lib/features/splash/branded_splash.dart) runs a second
  # branded phase with a live progress bar + rotating status messages before the
  # auth gate. Both phases share the navy brand background so there is no visible
  # seam between them.
  fill: false
  android_gravity: center
