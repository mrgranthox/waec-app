# NGINX edge — plan task 1.4.
# TLS 1.3 only, HSTS, rate limiting, CORS allowlist, Gzip/Brotli,
# <10KB payload budget, SSE-ready (proxy_buffering off, long read timeout).
# Certificates: Let's Encrypt via certbot webroot on port 80.

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 2048;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # ── Logging: structured, no PII/payload bodies ────────────────────────
  log_format json_combined escape=json
    '{"time":"$time_iso8601","remote_ip":"$remote_addr",'
    '"request":"$request","status":$status,'
    '"bytes":$body_bytes_sent,"rt":$request_time,'
    '"ua":"$http_user_agent"}';
  access_log /var/log/nginx/access.log json_combined;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 75s;
  server_tokens off;

  # ── Compression: Gzip + Brotli → result payloads <10KB (plan §4.10) ──
  gzip on;
  gzip_comp_level 6;
  gzip_min_length 256;
  gzip_vary on;
  gzip_types application/json application/x-ndjson text/plain text/css
             application/javascript application/grpc;

  # brotli module is dynamic in the nginx:alpine image; enable when
  # building the prod image with ngx_brotli. Gzip alone meets <10KB.
  # brotli on;
  # brotli_comp_level 5;
  # brotli_types application/json application/x-ndjson;

  # ── Rate limiting: auth endpoints stricter than API ───────────────────
  limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;
  limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;
  limit_req_status 429;
  limit_conn_zone $binary_remote_addr zone=perip:10m;

  # ── Upstream mTLS termination: services speak gRPC on internal net ────
  upstream auth_grpc       { server auth:50051;       keepalive 32; }
  upstream payment_grpc    { server payment:50052;    keepalive 32; }
  upstream distributor_grpc{ server distributor:50053;keepalive 32; }
  upstream handler_grpc    { server handler:50054;    keepalive 32; }
  upstream admin_grpc      { server admin:50055;      keepalive 32; }

  # SSE/streaming: disable buffering for these locations
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  include /etc/nginx/conf.d/*.conf;
}
