# Public edge server — api.<domain>
# TLS 1.3 only; HSTS; CORS allowlist; SSE-safe proxying.

# HTTP → HTTPS redirect + ACME webroot
server {
  listen 80;
  server_name _;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location = /healthz {
    access_log off;
    return 200 "ok\n";
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  http2 on;
  server_name _;

  # ── TLS 1.3 only (plan hard rule 5) ──────────────────────────────────
  ssl_certificate     /etc/letsencrypt/live/api/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/api/privkey.pem;
  ssl_protocols TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  # ── HSTS + security headers ──────────────────────────────────────────
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  # Client body budget: requests stay tiny; responses compressed <10KB
  client_max_body_size 32k;
  client_body_timeout 10s;

  # ── CORS: mobile app is native; allowlist only web dashboard origin ──
  set $cors_origin "";
  if ($http_origin ~* ^https://(dashboard\.waecplatform\.gh)$) {
    set $cors_origin $http_origin;
  }
  add_header Access-Control-Allow-Origin $cors_origin always;
  add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
  add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Idempotency-Key" always;

  # ── Auth (strict rate limit: brute-force defense, plan §4.6) ─────────
  location /v1/auth/ {
    limit_req zone=auth burst=5 nodelay;
    grpc_pass grpc://auth_grpc;
    include /etc/nginx/grpc-params.conf;
  }

  # ── Payments + verification (idempotency-key enforced at service) ────
  location /v1/payment/ {
    limit_req zone=api burst=10 nodelay;
    grpc_pass grpc://payment_grpc;
    include /etc/nginx/grpc-params.conf;
  }

  location /v1/transaction/ {
    limit_req zone=api burst=10 nodelay;
    grpc_pass grpc://distributor_grpc;
    include /etc/nginx/grpc-params.conf;
  }

  # ── SSE stream: no buffering, long timeouts, HTTP/2 keepalive ────────
  location /v1/stream/ {
    proxy_pass http://admin_grpc; # replaced by REST facade for SSE in Phase 2
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
    chunked_transfer_encoding on;
  }

  location / {
    grpc_read_timeout 10s;
    grpc_pass grpc://admin_grpc;
    include /etc/nginx/grpc-params.conf;
  }
}
